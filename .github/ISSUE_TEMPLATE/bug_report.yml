name: Bug 报告
description: 报告可复现的问题（安全问题请勿在此提交，见 SECURITY.md）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现的信息。
        如果是安全问题，请改用私密渠道：见 [SECURITY.md](https://github.com/xingyungames/StarMySql/blob/main/SECURITY.md)。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小可复现代码或调用序列（请把连接字符串、账号密码替换成占位符）
      placeholder: |
        1. 定义 PlayerRepository，TableName = DatabaseConstants.TableA
        2. 调用 GetDataByColumnAsync("col_b", "张三", fields)
        3. 返回 500 / 抛出异常
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Star.SqlData 版本 / 提交号
      placeholder: 1.0.0 或某个 commit sha
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET 版本
      placeholder: dotnet --version 的输出，例如 8.0.404
    validations:
      required: true

  - type: input
    id: mysql
    attributes:
      label: MySQL 版本（如涉及数据库行为）
      placeholder: 8.0.36

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 异常堆栈 / ApiResponse 输出
      description: 请删除其中的凭据与真实数据
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过 Issue 列表，确认不是重复问题
          required: true
        - label: 我已确认提交内容不包含真实凭据、密码或生产数据
          required: true
