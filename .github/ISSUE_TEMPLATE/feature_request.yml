name: 功能建议
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述现状与痛点，而不是直接给出实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 期望的 API 形态、行为与错误返回
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如在业务仓储里自己实现、改用 ORM 等

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 白名单 / 安全校验
        - 查询能力
        - 写入能力
        - 事务 / 连接管理
        - 错误码与响应格式
        - 文档与示例
        - CI / 工程化
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过 Issue 与 docs，确认不是已有能力
          required: true
